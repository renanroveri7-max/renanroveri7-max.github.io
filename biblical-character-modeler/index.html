function safe(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function root(){return document.getElementById("root");}
function active(){return projects.find(function(p){return p.id===activeId;})||null;}
function req(store,mode,callback){
 return new Promise(function(resolve,reject){
  var tx=db.transaction(store,mode),request;
  try{request=callback(tx.objectStore(store));}catch(e){reject(e);return;}
  tx.oncomplete=function(){resolve(request&&request.result);};
  tx.onerror=function(){reject(tx.error||new Error("Erro no banco local"));};
  tx.onabort=function(){reject(tx.error||new Error("Transação cancelada"));};
 });
}
function openDb(){
 return new Promise(function(resolve,reject){
  var request=indexedDB.open("biblical-character-modeler-web",7);
  request.onupgradeneeded=function(){var d=request.result;if(!d.objectStoreNames.contains("projects"))d.createObjectStore("projects",{keyPath:"id"});if(!d.objectStoreNames.contains("settings"))d.createObjectStore("settings",{keyPath:"key"});if(!d.objectStoreNames.contains("catalogs"))d.createObjectStore("catalogs",{keyPath:"projectId"});if(!d.objectStoreNames.contains("fichas"))d.createObjectStore("fichas",{keyPath:"projectId"});if(!d.objectStoreNames.contains("models"))d.createObjectStore("models",{keyPath:"modelId"});if(!d.objectStoreNames.contains("prompts"))d.createObjectStore("prompts",{keyPath:"projectId"});if(!d.objectStoreNames.contains("productionPackets"))d.createObjectStore("productionPackets",{keyPath:"projectId"});if(!d.objectStoreNames.contains("flowImports")){var fi=d.createObjectStore("flowImports",{keyPath:"id"});fi.createIndex("byProject","projectId",{unique:false});}if(!d.objectStoreNames.contains("flowAssets"))d.createObjectStore("flowAssets",{keyPath:"id"});};
  request.onsuccess=function(){db=request.result;resolve();};
  request.onerror=function(){reject(request.error);};
  request.onblocked=function(){reject(new Error("Feche outras abas deste site e tente novamente."));};
 });
}

 var group="",out="";

 out+='<button type="button" data-page="'+p[1]+'" class="nav-btn '+(page===p[1]?'active':'')+'"><i>'+p[2]+'</i>'+safe(p[0])+(p[1]!=="overview"&&p[1]!=="projects"?"<em>·</em>":"")+'</button>';});return out;
}

 '<div class="stats"><div class="stat"><label>PROJETO ATIVO</label><strong class="sm">'+(a?safe(a.name):"Nenhum selecionado")+'</strong><span>'+(a?safe(a.book):"Selecione ou crie seu primeiro projeto")+'</span></div><div class="stat"><label>PROJETOS TOTAIS</label><strong>'+projects.length+'</strong><span>Organizados por livro bíblico</span></div><div class="stat"><label>ARMAZENAMENTO</label><strong class="sm">INDEXEDDB</strong><span>Persistência local no navegador</span></div></div>'+

 '<p class="fine">Sem chamadas de IA nesta versão. Os projetos salvos no navegador não são sincronizados entre dispositivos; conectaremos o banco em nuvem em uma etapa posterior.</p>';
}
function projectsHtml(){
 var content=projects.length?'<div class="cards">'+projects.map(function(p){return '<div class="card '+(p.id===activeId?'sel':'')+'"><div class="symbol">▱</div>'+(p.id===activeId?'<span class="badge">ATIVO</span>':'')+'<h2>'+safe(p.name)+'</h2><p>'+safe(p.book)+'</p><div class="meta">Criado em '+new Date(p.createdAt).toLocaleDateString("pt-BR")+'</div><div class="actions"><button class="btn" data-action="select" data-id="'+safe(p.id)+'" '+(p.id===activeId?'disabled':'')+'>'+(p.id===activeId?'Selecionado':'Selecionar')+'</button><button class="mini" data-action="edit" data-id="'+safe(p.id)+'" title="Renomear">✎</button><button class="mini danger" data-action="delete" data-id="'+safe(p.id)+'" title="Excluir">✕</button></div></div>';}).join('')+'</div>':
 '<div class="panel"><div class="emblem">▱</div><h2>Nenhum projeto cadastrado</h2><p>Crie um projeto para cada livro bíblico. Ele continuará disponível neste navegador depois de atualizar a página.</p><button class="btn" data-action="create">Criar primeiro projeto</button></div>';

}

 return heading("IMPORTAÇÃO E VALIDAÇÃO","Catálogo de Personagens","Leitura segura de registros individuais e grupos por projeto.","<span class='badge'>CATÁLOGO WEB 0.2.0</span>")+
 window.BCMCatalog.pageHtml(active(),catalog,catalogPreview,catFilter,catSearch,catSelectedId);

async function restoreCatalog(){
 clearCatalogUi();
 if(!activeId){catalog=null;return;}
 catalog=await req("catalogs","readonly",function(s){return s.get(activeId);});
 var savedDraft=await req("settings","readonly",function(s){return s.get("catalogDraft:"+activeId);});
 if(savedDraft && savedDraft.value && savedDraft.value.projectId===activeId && Array.isArray(savedDraft.value.records)){
  catalogPreview=savedDraft.value;
  message="Rascunho de importação recuperado. Clique em Confirmar importação para salvar definitivamente.";
 }
}

 fichaSearch="";fichaSelectedId=null;

}

}
async function restoreModels(){
 var list=await req("models","readonly",function(s){return s.getAll();});
 modelsSaved={individual:null,group:null};
 list.forEach(function(m){
  if(m && (m.modelId==="official_individual"||m.modelId==="official_group")){
   modelsSaved[m.modelId==="official_individual"?"individual":"group"]=m;
  }
 });
 modelDraft={individual:null,group:null};
 window.BCMModels.clearUrls();
}

}

 promptSelectedId=null;promptFilter="all";promptSearch="";
 promptBundle=activeId?await req("prompts","readonly",function(s){return s.get(activeId);}):null;
}

 return heading("MOTOR CENTRAL DE PROMPTS","Prompts de Produção","Prompts individualizados e verificáveis, com os modelos fixos e as fichas técnicas.","<span class='badge'>PROMPTS WEB 0.5.0</span>")+
 window.BCMPrompts.pageHtml(active(),catalog,fichasBundle,modelsSaved,promptBundle,promptSelectedId,promptFilter,promptSearch);
}
function persistPromptBundle(next,projectId){
 return req("prompts","readwrite",function(s){return s.put(next);}).then(function(){
  return req("prompts","readonly",function(s){return s.get(projectId);});
 }).then(function(recovered){
  if(!recovered||!recovered.items||recovered.items.length!==next.items.length)throw new Error("Não foi possível confirmar o salvamento dos prompts.");
  if(projectId!==activeId)throw new Error("O projeto ativo mudou durante o salvamento.");
  promptBundle=recovered;
 });
}

 productionBundle=activeId?await req("productionPackets","readonly",function(s){return s.get(activeId);}):null;
}

 var msg=connectorStatus

}

 return heading("INTEGRAÇÃO EXPERIMENTAL","Google Flow — Ponte com o Chrome","Testando comunicação com a sessão Flow aberta no seu próprio navegador.","<span class='badge'>FLOW BRIDGE 0.7.3 — ENVIO DE PROMPT</span>")+
 '<div id="bcm-bridge-placeholder"></div>'+
 window.BCMFlow.pageHtml(active(),catalog,fichasBundle,promptBundle,modelsSaved,flowImports,flowSelectedId,flowPreviewId,flowPreviewURL);

async function saveFlowImage(prepared){
 return new Promise(function(resolve,reject){
  var tx=db.transaction(["flowImports","flowAssets"],"readwrite");
  tx.objectStore("flowAssets").put(prepared.asset);
  tx.objectStore("flowImports").put(prepared.metadata);
  tx.oncomplete=function(){resolve();};
  tx.onerror=function(){reject(tx.error||new Error("Falha ao salvar imagem."));};
  tx.onabort=function(){reject(tx.error||new Error("Gravação da imagem cancelada."));};
 });
}
async function deleteFlowProject(projectId){
 var ids=await req("flowImports","readonly",function(s){return s.index("byProject").getAllKeys(projectId);});
 if(!ids.length)return;
 await new Promise(function(resolve,reject){
  var tx=db.transaction(["flowImports","flowAssets"],"readwrite");
  ids.forEach(function(id){tx.objectStore("flowImports").delete(id);tx.objectStore("flowAssets").delete(id);});
  tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error||new Error("Falha ao excluir imagens do projeto."));};
  tx.onabort=function(){reject(tx.error||new Error("Exclusão de imagens cancelada."));};
 });
}

function attempt(fn){if(busy)return;busy=true;error="";message="";Promise.resolve().then(fn).catch(function(e){error=e&&e.message||"Erro inesperado";}).finally(function(){busy=false;render();});}
document.addEventListener("click",function(e){
 if(e.target.id==="overlay"){modal=null;render();return;}
 var el=e.target.closest("[data-page],[data-action],[data-cat-action],[data-cat-filter],[data-cat-record],[data-ficha-action],[data-ficha-id],[data-model-action],[data-prompt-action],[data-prompt-filter],[data-prompt-open],[data-prompt-copy],[data-prod-id],[data-prod-action],[data-connector-check],[data-flow-action],[data-flow-view],[data-flow-download]");if(!el)return;
 if(el.hasAttribute("data-flow-action")||el.hasAttribute("data-flow-view")||el.hasAttribute("data-flow-download")){
  var r=catalog&&catalog.records.find(function(v){return v.id_tecnico===flowSelectedId;});
  if(el.hasAttribute("data-flow-view")){
   var viewId=el.dataset.flowView,entry=flowImports.find(function(v){return v.id===viewId&&v.recordId===flowSelectedId;});
   if(!entry)return;
   attempt(async function(){
    var asset=await req("flowAssets","readonly",function(s){return s.get(viewId);});
    if(!asset||!asset.blob)throw Error("Imagem não disponível no armazenamento deste navegador.");
    flowPreviewURL=window.BCMFlow.retainUrl(viewId,asset.blob);flowPreviewId=viewId;
   });return;
  }
  if(el.hasAttribute("data-flow-download")){
   var downloadId=el.dataset.flowDownload,entry=flowImports.find(function(v){return v.id===downloadId&&v.recordId===flowSelectedId;});
   if(!entry)return;
   attempt(async function(){
    var asset=await req("flowAssets","readonly",function(s){return s.get(downloadId);});
    if(!asset||!asset.blob)throw Error("Imagem não disponível para baixar.");
    window.BCMFlow.downloadBlob(asset.blob,entry.filename);
    message="Download solicitado: "+entry.filename;
   });return;
  }
  if(el.dataset.flowAction==="clear-preview"){window.BCMFlow.cleanup();flowPreviewId=null;flowPreviewURL=null;render();return;}
  if(!r)return;
  var check=window.BCMFlow.validSelection(r,catalog,fichasBundle,promptBundle,modelsSaved);
  if(!check.ok){error=check.reason;render();return;}
  if(el.dataset.flowAction==="prefill"){
   if(!window.BCMBridge||typeof window.BCMBridge.prefill!=="function"){
    error="Módulo de integração não disponível. Atualize o aplicativo.";
    render();return;
   }
   if(!confirm("Teste experimental: enviar o prompt de "+r.nome+" ("+(r.fase||r.id_original)+") ao campo vazio do projeto Google Flow aberto. A extensão NÃO clicará em Gerar nem consumirá créditos. Continuar?"))return;
   attempt(async function(){
    const result=await window.BCMBridge.prefill(check.prompt.fullPrompt);
    if(!result||!result.prefilled)throw Error(result?.error||"O Flow não confirmou o recebimento do texto.");
    message="Prompt transferido para o editor do Google Flow ("+result.characters+" caracteres). Confira visualmente a guia Flow; NENHUMA geração foi iniciada.";
   });return;
  }
  if(el.dataset.flowAction==="copy"){
   attempt(async function(){
    if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error("O navegador não disponibilizou a área de transferência.");
    await navigator.clipboard.writeText(check.prompt.fullPrompt);
    message="Prompt de "+r.nome+" ("+(r.fase||r.id_original)+") copiado. Cole no Google Flow.";
   });return;
  }
  if(el.dataset.flowAction==="download-ref"){
   window.BCMFlow.downloadBlob(check.model.blob,check.model.filename||"modelo-oficial.png");message="Download da referência oficial solicitado.";render();return;
  }
  if(el.dataset.flowAction==="choose"){var fileInput=document.getElementById("flow-result-file");if(fileInput)fileInput.click();return;}
 }

 if(el.hasAttribute("data-connector-check")){
  attempt(async function(){
   var result;
   try{
    result=await fetch("https://biblical-character-modeler-api.vercel.app/api/bcm-status",{method:"GET",mode:"cors",credentials:"omit",cache:"no-store",headers:{"Accept":"application/json"}});
   }catch(networkError){
    throw Error("Falha ao consultar a Vercel. Possíveis causas: proteção de acesso, CORS ou bloqueio de rede. A produção continua bloqueada.");
   }
   if(!result.ok)throw Error("O backend dedicado retornou HTTP "+result.status+". Verifique a função e a proteção do projeto. Nenhuma geração foi iniciada.");
   var kind=result.headers.get("content-type")||"";
   if(!kind.includes("application/json"))throw Error("A Vercel não devolveu JSON da API. Pode estar redirecionando para autenticação.");
   var info=await result.json();
   if(!info||info.service!=="biblical-character-modeler"||info.api!=="diagnostic-v0.6.4")throw Error("A resposta do servidor não corresponde ao conector esperado.");
   connectorStatus=info;
   message="Diagnóstico respondido pelo servidor. Geração de imagens permanece desabilitada até configuração segura.";
  });return;
 }

 if(el.hasAttribute("data-prod-action")){
  var action=el.dataset.prodAction,recordId=el.dataset.prodId,record=catalog&&catalog.records.find(function(r){return r.id_tecnico===recordId;});
  if(!record||!activeId)return;
  if(action==="pack"){
   attempt(async function(){
    var projectId=activeId;
    var pack=window.BCMProduction.build(record,active(),catalog,fichasBundle,promptBundle,modelsSaved);
    var previous=productionBundle&&productionBundle.packets||[];
    var items=previous.filter(function(p){return p.recordId!==recordId;}).concat([pack]);
    var next={projectId:projectId,packets:items,updatedAt:Date.now(),schemaVersion:1};
    await req("productionPackets","readwrite",function(s){return s.put(next);});
    var reloaded=await req("productionPackets","readonly",function(s){return s.get(projectId);});
    var confirmed=reloaded&&reloaded.packets&&reloaded.packets.find(function(p){return p.recordId===recordId;});
    if(!confirmed||!window.BCMProduction.current(confirmed,record,catalog,fichasBundle,promptBundle,modelsSaved))throw Error("Falha ao confirmar o pacote preparado.");
    if(projectId!==activeId)throw Error("Projeto mudou durante o salvamento.");
    productionBundle=reloaded;productionId=recordId;
    message="PACOTE TÉCNICO SALVO E RECUPERADO. Nenhuma imagem foi gerada e nenhuma API foi chamada.";
   });return;
  }
  if(action==="inspect"){
   var pack=productionBundle&&productionBundle.packets.find(function(p){return p.recordId===recordId;});
   if(!pack){error="Nenhum pacote salvo para este registro.";render();return;}
   if(!navigator.clipboard||!navigator.clipboard.writeText){error="Área de transferência indisponível.";render();return;}
   navigator.clipboard.writeText(window.BCMProduction.inspect(pack)).then(function(){message="Metadados do pacote copiados para a área de transferência.";error="";render();}).catch(function(e){error="Não foi possível copiar os metadados: "+e.message;render();});return;
  }
 }
 if(el.hasAttribute("data-prod-id")){productionId=el.dataset.prodId;render();return;}

 if(el.hasAttribute("data-prompt-filter")){promptFilter=el.dataset.promptFilter;render();return;}
 if(el.hasAttribute("data-prompt-open")){promptSelectedId=el.dataset.promptOpen;render();return;}
 if(el.hasAttribute("data-prompt-copy")){
  var targetId=el.dataset.promptCopy,r=catalog&&catalog.records.find(function(x){return x.id_tecnico===targetId;});
  var candidate=r&&window.BCMPrompts.infoFor(r,promptBundle);
  if(!r||!candidate||candidate.status==="error"||!window.BCMPrompts.currentItem(r,fichasBundle,modelsSaved,candidate)){error="Prompt inválido ou desatualizado. Atualize antes de copiar.";render();return;}
  if(!navigator.clipboard||!navigator.clipboard.writeText){error="A área de transferência não está disponível neste navegador.";render();return;}
  navigator.clipboard.writeText(candidate.fullPrompt).then(function(){message="Prompt consolidado copiado com sucesso.";error="";render();}).catch(function(e){error="Não foi possível copiar o prompt: "+(e.message||e);render();});return;
 }
 if(el.hasAttribute("data-prompt-action")){
  var action=el.dataset.promptAction;
  if(action==="close"){promptSelectedId=null;render();return;}
  if(action==="prepare"){
   if(!activeId){error="Selecione um projeto primeiro.";render();return;}
   attempt(async function(){
    var projectId=activeId;
    var result=window.BCMPrompts.prepareAll(catalog,fichasBundle,modelsSaved,promptBundle);
    await persistPromptBundle(result,projectId);
    message="Prompts gravados e recuperados: "+result.items.length+" registros. Abra VER PROMPT para conferir avisos e detalhes.";
   });return;
  }
 }

 if(el.hasAttribute("data-model-action")){
  var modelAction=el.dataset.modelAction,slot=el.dataset.modelSlot;
  if(modelAction==="choose"){
   var input=document.getElementById("official-file-"+slot);if(input)input.click();return;
  }
  if(modelAction==="discard" && (slot==="individual"||slot==="group")){
   modelDraft[slot]=null;message="Prévia descartada; referências salvas preservadas.";render();return;
  }
  if(modelAction==="save"){
   if(!window.BCMModels.canSave(modelsSaved,modelDraft)){
    error="Importe os dois modelos antes de ativá-los.";render();return;
   }
   if(!confirm("Salvar e ativar as duas referências oficiais? Qualquer modelo substituído será atualizado no armazenamento deste navegador."))return;
   attempt(async function(){
    var packed=window.BCMModels.pack(modelsSaved,modelDraft);
    await req("models","readwrite",function(s){s.put(packed[0]);return s.put(packed[1]);});
    var check=await req("models","readonly",function(s){return s.getAll();});
    var recovered={individual:null,group:null};
    check.forEach(function(m){if(m.modelId==="official_individual")recovered.individual=m;else if(m.modelId==="official_group")recovered.group=m;});
    if(!window.BCMModels.ready(recovered))throw new Error("A confirmação de gravação das imagens falhou.");
    modelsSaved=recovered;modelDraft={individual:null,group:null};window.BCMModels.clearUrls();
    message="MODELOS SALVOS E ATIVOS no IndexedDB. Ambos confirmados; atualize com F5 para validar a recuperação.";
   });return;
  }
  return;
 }

 if(el.hasAttribute("data-ficha-id")){fichaSelectedId=el.dataset.fichaId;render();return;}
 if(el.hasAttribute("data-ficha-action")){
  var fa=el.dataset.fichaAction;
  if(fa==="prepare"){
   if(!catalog||!activeId){error="Selecione um projeto com catálogo confirmado.";render();return;}
   if(!confirm("Preparar ou atualizar as fichas do catálogo? Edições manuais já salvas serão preservadas."))return;
   attempt(async function(){
    var projectId=activeId,oldBundle=fichasBundle;
    var generated=window.BCMFicha.prepare(catalog,oldBundle);
    await req("fichas","readwrite",function(s){return s.put(generated);});
    var stored=await req("fichas","readonly",function(s){return s.get(projectId);});
    if(!stored||stored.fichas.length!==generated.fichas.length)throw new Error("As fichas não foram recuperadas após o salvamento.");
    if(activeId!==projectId)throw new Error("O projeto ativo mudou durante a preparação.");
    fichasBundle=stored;fichaSelectedId=stored.fichas[0]?stored.fichas[0].id:null;
    message="Fichas SALVAS no IndexedDB: "+stored.fichas.length+" ("+stored.fichas.filter(function(f){return f.kind!=="Integrante";}).length+" principais + "+stored.fichas.filter(function(f){return f.kind==="Integrante";}).length+" integrantes).";
   });return;
  }
 }

 if(el.hasAttribute("data-cat-record")){catSelectedId=el.dataset.catRecord;render();return;}
 if(el.hasAttribute("data-cat-filter")){catFilter=el.dataset.catFilter;render();return;}
 if(el.hasAttribute("data-cat-action")){
  var ca=el.dataset.catAction;
  if(ca==="choose"){document.getElementById("catalog-file").click();return;}
  if(ca==="cancel"){attempt(async function(){
   if(activeId)await req("settings","readwrite",function(s){return s.delete("catalogDraft:"+activeId);});
   catalogPreview=null;catFile=null;catSelectedId=null;message="Prévia cancelada. Catálogo existente preservado.";
  });return;}
  if(ca==="close-detail"){catSelectedId=null;render();return;}
  if(ca==="confirm"){
   if(!catalogPreview || catalogPreview.stats.errorCount>0 || !activeId)return;
   if(catalog && !confirm("Substituir o catálogo atual deste projeto? Os dados anteriores deixarão de aparecer."))return;
   attempt(async function(){
    var copy=Object.assign({},catalogPreview);delete copy.sheets;
    if(copy.projectId!==activeId)throw new Error("O projeto ativo mudou. Selecione o projeto correto e tente novamente.");
    await req("catalogs","readwrite",function(s){return s.put(copy);});
    var saved=await req("catalogs","readonly",function(s){return s.get(activeId);});
    if(!saved || !saved.records || saved.records.length!==copy.records.length)throw new Error("Falha na verificação do catálogo gravado. A prévia foi preservada.");
    await req("settings","readwrite",function(s){return s.delete("catalogDraft:"+activeId);});
    catalog=saved;catalogPreview=null;catFile=null;catSelectedId=null;
    message="Catálogo SALVO e confirmado no IndexedDB: "+saved.records.length+" registros. Pode atualizar com F5.";
   });return;

 if(el.dataset.page){if(page==="models"&&el.dataset.page!=="models")window.BCMModels.clearUrls();page=el.dataset.page;modal=null;message="";render();return;}
 var action=el.dataset.action,id=el.dataset.id;
 if(action==="close"){modal=null;render();return;}
 if(action==="create"){modal={id:null};render();return;}
 if(action==="edit"){modal={id:id};render();return;}
 if(action==="select"){attempt(async function(){await req("settings","readwrite",function(s){return s.put({key:"activeProject",value:id});});activeId=id;await restoreCatalog();await restoreFichas();await restorePrompts();await restoreProduction();await restoreFlow();message="Projeto selecionado.";});return;}
 if(action==="delete"){var p=projects.find(function(x){return x.id===id;});if(!p||!confirm('Excluir o projeto "'+p.name+'"? Esta ação não pode ser desfeita.'))return;attempt(async function(){await req("projects","readwrite",function(s){return s.delete(id);});await req("catalogs","readwrite",function(s){return s.delete(id);});await req("fichas","readwrite",function(s){return s.delete(id);});await req("prompts","readwrite",function(s){return s.delete(id);});await req("productionPackets","readwrite",function(s){return s.delete(id);});await deleteFlowProject(id);projects=projects.filter(function(x){return x.id!==id;});if(activeId===id){await req("settings","readwrite",function(s){return s.put({key:"activeProject",value:null});});activeId=null;catalog=null;fichasBundle=null;promptBundle=null;productionBundle=null;productionId=null;flowImports=[];flowSelectedId=null;window.BCMFlow.cleanup();flowPreviewId=null;flowPreviewURL=null;clearCatalogUi();}message="Projeto excluído.";});}
});
document.addEventListener("submit",function(e){
 if(e.target.id==="prompt-notes-form"){
  e.preventDefault();
  var recordId=e.target.dataset.promptId,form=e.target;
  var record=catalog&&catalog.records.find(function(r){return r.id_tecnico===recordId;});
  if(!record||!activeId)return;
  var newNotes=String(new FormData(form).get("userNotes")||"");
  if(newNotes.length>15000){error="As observações devem conter no máximo 15.000 caracteres.";render();return;}
  attempt(async function(){
   var projectId=activeId;
   if(!fichasBundle||fichasBundle.catalogImportedAt!==catalog.importedAt)throw Error("Atualize as fichas técnicas primeiro.");
   var old=window.BCMPrompts.infoFor(record,promptBundle);
   var revised=window.BCMPrompts.prepareOne(record,fichasBundle.fichas,modelsSaved,{userNotes:newNotes});
   var other=promptBundle&&promptBundle.items||[];
   var next={projectId:projectId,catalogImportedAt:catalog.importedAt,items:other.some(function(x){return x.recordId===recordId;})?other.map(function(x){return x.recordId===recordId?revised:x;}):other.concat([revised]),updatedAt:Date.now(),schemaVersion:1};
   await persistPromptBundle(next,projectId);
   promptSelectedId=recordId;message="Observações salvas e incorporadas ao prompt do personagem.";
  });return;
 }
 if(e.target.id==="ficha-form"){
  e.preventDefault();
  var fid=e.target.dataset.fichaForm,form=e.target;
  if(!fichasBundle||!fid)return;
  var existing=fichasBundle.fichas.find(function(f){return f.id===fid;});
  if(!existing)return;
  var edited=window.BCMFicha.saveValues(existing,form);
  attempt(async function(){
   var projectId=activeId;
   var next=Object.assign({},fichasBundle,{
    fichas:fichasBundle.fichas.map(function(f){return f.id===fid?edited:f;}),
    updatedAt:Date.now()
   });
   await req("fichas","readwrite",function(s){return s.put(next);});
   var stored=await req("fichas","readonly",function(s){return s.get(projectId);});
   var check=stored&&stored.fichas.find(function(f){return f.id===fid;});
   if(!check||check.updatedAt!==edited.updatedAt)throw new Error("A edição não pôde ser confirmada no banco.");
   if(activeId!==projectId)throw new Error("O projeto mudou durante o salvamento.");
   fichasBundle=stored;fichaSelectedId=fid;message="Ficha atualizada e salva. Pode testar o F5.";
  });
  return;
 }
 if(e.target.id!=="project-form")return;e.preventDefault();
 var f=new FormData(e.target),name=String(f.get("name")||"").trim(),book=String(f.get("book")||"").trim();if(!name||!book)return;
 var id=modal&&modal.id;
 attempt(async function(){
  var old=id?projects.find(function(x){return x.id===id;}):null,now=Date.now(),p={id:old?old.id:crypto.randomUUID(),name:name,book:book,createdAt:old?old.createdAt:now,updatedAt:now,schemaVersion:2};
  await req("projects","readwrite",function(s){return s.put(p);});
  projects=old?projects.map(function(x){return x.id===id?p:x;}):[p].concat(projects);
  if(!old){await req("settings","readwrite",function(s){return s.put({key:"activeProject",value:p.id});});activeId=p.id;catalog=null;fichasBundle=null;promptBundle=null;promptSelectedId=null;productionBundle=null;productionId=null;flowImports=[];flowSelectedId=null;window.BCMFlow.cleanup();flowPreviewId=null;flowPreviewURL=null;fichaSelectedId=null;fichaSearch="";clearCatalogUi();}
  modal=null;message=old?"Projeto atualizado.":"Projeto criado e selecionado.";
 });
});
document.addEventListener("input",function(e){
 if(e.target.id==="prompt-search"){
  var cursor=e.target.selectionStart;promptSearch=e.target.value;render();
  var focus=document.getElementById("prompt-search");
  if(focus){focus.focus();try{focus.setSelectionRange(cursor,cursor);}catch(_e){}}
  return;
 }
 if(e.target.id==="ficha-search"){
  var cursor=e.target.selectionStart;fichaSearch=e.target.value;render();
  var field=document.getElementById("ficha-search");
  if(field){field.focus();try{field.setSelectionRange(cursor,cursor);}catch(_e){}}
  return;
 }
 if(e.target.id!=="catalog-search")return;
 var start=e.target.selectionStart;catSearch=e.target.value;render();
 var field=document.getElementById("catalog-search");if(field){field.focus();try{field.setSelectionRange(start,start);}catch(_e){}}
});
document.addEventListener("change",function(e){
 if(e.target.id==="flow-record"){
  flowSelectedId=e.target.value;window.BCMFlow.cleanup();flowPreviewId=null;flowPreviewURL=null;error="";message="";render();return;
 }
 if(e.target.id==="flow-result-file"){
  var image=e.target.files&&e.target.files[0];
  var project=active(),record=catalog&&catalog.records.find(function(r){return r.id_tecnico===flowSelectedId;});
  if(!image||!project||!record)return;
  if(!confirm('Importar "'+image.name+'" para '+record.nome+' — '+(record.fase||"sem fase")+'? Confira que a imagem pertence à identidade correta.')){e.target.value="";return;}
  attempt(async function(){
   var id=project.id,selected=record.id_tecnico;
   var packed=await window.BCMFlow.prepareImport(image,record,project,catalog,fichasBundle,promptBundle,modelsSaved);
   if(activeId!==id||flowSelectedId!==selected)throw Error("O projeto ou personagem mudou durante a importação.");
   await saveFlowImage(packed);
   var savedAsset=await req("flowAssets","readonly",function(s){return s.get(packed.metadata.id);});
   var savedMeta=await req("flowImports","readonly",function(s){return s.get(packed.metadata.id);});
   if(!savedMeta||!savedAsset||!savedAsset.blob||savedAsset.blob.size!==image.size)throw Error("O arquivo não pôde ser confirmado no armazenamento.");
   flowImports=await req("flowImports","readonly",function(s){return s.index("byProject").getAll(id);});
   flowPreviewId=packed.metadata.id;flowPreviewURL=window.BCMFlow.retainUrl(packed.metadata.id,savedAsset.blob);
   message="Imagem recebida, vinculada a "+record.nome+" ("+(record.fase||record.id_original)+") e salva no IndexedDB. Aguardando auditoria manual. Teste F5 para confirmar.";
  });return;
 }
 if(e.target.id==="official-file-individual" || e.target.id==="official-file-group"){
  var slot=e.target.id.slice("official-file-".length),file=e.target.files&&e.target.files[0];
  if(!file)return;
  attempt(async function(){
   var staged=await window.BCMModels.validate(file,slot);
   modelDraft[slot]=staged;
   message="Referência "+(slot==="individual"?"individual":"de grupo")+" validada como prévia. Clique em SALVAR E ATIVAR para persistir.";
  });return;
 }
 if(e.target.id==="catalog-file"){
  var file=e.target.files&&e.target.files[0];if(!file||!activeId)return;
  catFile=file;attempt(async function(){
   var projectId=activeId,preview=await window.BCMCatalog.parseFile(file,projectId);
   await req("settings","readwrite",function(s){return s.put({key:"catalogDraft:"+projectId,value:preview});});
   if(activeId!==projectId)throw new Error("Projeto alterado durante a importação. Volte ao projeto original.");
   catalogPreview=preview;catSearch="";catFilter="all";catSelectedId=null;
   message=preview.stats.errorCount?"Importação contém erros: corrija antes de confirmar.":"Prévia salva como rascunho. Clique em Confirmar importação para concluir.";
  });
 }
 if(e.target.id==="catalog-sheet" && catFile && activeId){
  var sheet=e.target.value;
  attempt(async function(){
    var projectId=activeId,preview=await window.BCMCatalog.parseFile(catFile,projectId,sheet);
    await req("settings","readwrite",function(s){return s.put({key:"catalogDraft:"+projectId,value:preview});});
    if(activeId!==projectId)throw new Error("Projeto mudou durante a importação.");
    catalogPreview=preview;catSelectedId=null;message="Aba do Excel selecionada: "+sheet+". Clique em Confirmar importação.";
   });
 }
});
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"&&modal){modal=null;render();}
 if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-cat-record]")){e.preventDefault();catSelectedId=e.target.dataset.catRecord;render();}
});
openDb().then(async function(){
 projects=await req("projects","readonly",function(s){return s.getAll();});
 projects.sort(function(a,b){return b.updatedAt-a.updatedAt;});
 var saved=await req("settings","readonly",function(s){return s.get("activeProject");});
 activeId=saved&&projects.some(function(p){return p.id===saved.value;})?saved.value:null;
 await restoreCatalog();
 await restoreFichas();
 await restoreModels();
 await restorePrompts();
 await restoreProduction();
 await restoreFlow();
 render();
}).catch(function(e){error="O IndexedDB não abriu: "+(e.message||e);render();});
})();
</script></body></html>
