name: TRANSFORMA 360 — Next.js validation
on:
  push:
    paths:
      - 'transforma360-nextjs/**'
      - '.github/workflows/transforma360-nextjs-ci.yml'
  pull_request:
    paths:
      - 'transforma360-nextjs/**'
      - '.github/workflows/transforma360-nextjs-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transforma360-nextjs
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
